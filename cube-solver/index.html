<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style>
<title>Cube Solver</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600&family=JetBrains+Mono:wght@500;800&family=Unbounded:wght@500;700&display=swap">
<style>
/* Layout: workbench — 3D stage fills the left, a tool panel on the right (stacks under the stage on phones) */
:root {
  --bg: #E9ECF1;
  --surface: #FFFFFF;
  --stage: #DDE1E8;
  --stage-2: #F4F6F9;
  --ink: #14161B;
  --muted: #5B6271;
  --line: #CDD2DB;
  --accent: #5A2BE0;
  --accent-ink: #FFFFFF;
  --accent-soft: #ECE7FF;
  --accent-text: #4219B5;
  --ok: #138A4C;
  --warn: #B4540A;
  --bad: #C42032;
  --bad-soft: #FCE6E8;
  --empty: #9AA0AB;
  --f-display: "Unbounded", "Arial Black", system-ui, sans-serif;
  --f-body: "Golos Text", "Segoe UI", system-ui, -apple-system, sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, "SF Mono", Consolas, monospace;
  --r: 12px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #101217; --surface: #181B22; --stage: #0A0C10; --stage-2: #1A1E26;
    --ink: #ECEEF3; --muted: #9AA2B1; --line: #2B303A;
    --accent: #9D84FF; --accent-ink: #12082E; --accent-soft: #241B45; --accent-text: #C9BBFF;
    --ok: #3CCB7F; --warn: #F2A04A; --bad: #FF6474; --bad-soft: #3A161B; --empty: #5A606C;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #101217; --surface: #181B22; --stage: #0A0C10; --stage-2: #1A1E26;
  --ink: #ECEEF3; --muted: #9AA2B1; --line: #2B303A;
  --accent: #9D84FF; --accent-ink: #12082E; --accent-soft: #241B45; --accent-text: #C9BBFF;
  --ok: #3CCB7F; --warn: #F2A04A; --bad: #FF6474; --bad-soft: #3A161B; --empty: #5A606C;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  background: var(--bg); color: var(--ink);
  font-family: var(--f-body); font-size: 15px; line-height: 1.45;
  display: flex; flex-direction: column;
}
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

header.top {
  display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap;
  padding-block: 12px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  border-bottom: 1px solid var(--line);
}
.brand { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; min-width: 0; }
.brand h1 { font-family: var(--f-display); font-weight: 700; font-size: 20px; margin: 0; letter-spacing: -0.01em; }
.brand h1 .dot { display: inline-grid; grid-template-columns: repeat(2, 6px); gap: 2px; margin-right: 8px; vertical-align: 2px; }
.brand h1 .dot i { width: 6px; height: 6px; border-radius: 1.5px; display: block; }
.brand p { margin: 0; color: var(--muted); font-size: 13px; }
.solver-chip {
  display: inline-flex; align-items: center; gap: 8px; font-size: 12.5px; color: var(--muted);
  padding: 5px 10px; border: 1px solid var(--line); border-radius: 999px; background: var(--surface);
}
.solver-chip i { width: 8px; height: 8px; border-radius: 50%; background: var(--warn); display: block; }
.solver-chip.ready i { background: var(--ok); }
.solver-chip.busy i { animation: blink 1s infinite; }
@keyframes blink { 50% { opacity: .25; } }

main.work {
  flex: 1; min-height: 0;
  display: grid; grid-template-columns: minmax(0, 1fr) minmax(340px, 420px);
}
.stage {
  position: relative; min-height: 0; overflow: hidden;
  background: radial-gradient(120% 90% at 50% 40%, var(--stage-2), var(--stage));
}
.stage canvas { display: block; width: 100%; height: 100%; touch-action: none; cursor: grab; }
.stage canvas.paintable { cursor: crosshair; }
.stage canvas.dragging { cursor: grabbing; }
.stage-hint {
  position: absolute; left: max(16px, env(safe-area-inset-left, 0px)); top: 14px;
  font-size: 12.5px; color: var(--muted); pointer-events: none;
}
.stage-tools {
  position: absolute; right: 14px; bottom: 14px; display: flex; gap: 8px;
}
.ghost {
  border: 1px solid transparent; background: var(--accent-soft); color: var(--accent-text); border-radius: 999px;
  padding: 7px 13px; font-size: 13px; font-weight: 600; cursor: pointer;
}
.ghost:hover { border-color: var(--accent); }

.panel {
  border-left: 1px solid var(--line); background: var(--surface);
  overflow-y: auto; min-height: 0;
  padding-block: 18px 28px;
  padding-left: 20px; padding-right: max(20px, env(safe-area-inset-right, 0px));
  display: flex; flex-direction: column; gap: 18px;
}
.panel section { display: flex; flex-direction: column; gap: 10px; }
.label {
  font-size: 11.5px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 600;
}
.lead { margin: 0; color: var(--muted); font-size: 14px; max-width: 60ch; }

/* palette */
.palette { display: grid; grid-template-columns: repeat(6, 1fr); gap: 8px; }
.swatch {
  display: flex; flex-direction: column; align-items: center; gap: 5px;
  background: none; border: 0; padding: 0; cursor: pointer;
}
.swatch .chip {
  width: 100%; aspect-ratio: 1; max-width: 52px; border-radius: 10px;
  border: 1px solid rgba(0,0,0,.18); position: relative;
  box-shadow: inset 0 -3px 0 rgba(0,0,0,.12);
  transition: transform .12s;
}
.swatch .chip kbd {
  position: absolute; right: 4px; bottom: 3px; font-family: var(--f-mono); font-size: 10px;
  color: rgba(0,0,0,.45);
}
.swatch[aria-pressed="true"] .chip { outline: 3px solid var(--accent); outline-offset: 2px; transform: translateY(-2px); }
.swatch .cnt { font-family: var(--f-mono); font-size: 12px; font-variant-numeric: tabular-nums; color: var(--muted); }
.swatch .cnt.over { color: var(--bad); font-weight: 800; }
.swatch .cnt.under { color: var(--warn); }
.swatch .cnt.full { color: var(--ok); }

/* net */
.net-wrap { overflow-x: auto; }
.net {
  --cell: clamp(22px, 7.4vw, 27px);
  display: grid; grid-template-columns: repeat(12, var(--cell)); grid-template-rows: repeat(9, var(--cell));
  gap: 2px; width: max-content; margin-inline: auto;
}
.cell {
  border: 0; border-radius: 4px; padding: 0; cursor: pointer; position: relative;
  box-shadow: inset 0 0 0 1px rgba(0,0,0,.15);
  font-family: var(--f-mono); font-size: 10px; font-weight: 800; color: rgba(0,0,0,.5);
}
.cell.empty { background: transparent !important; box-shadow: inset 0 0 0 1.5px var(--empty); }
.cell.empty.center { color: var(--muted); }
.cell.bad { animation: badpulse .9s ease-in-out infinite; }
@keyframes badpulse { 50% { box-shadow: inset 0 0 0 3px var(--bad), 0 0 0 2px var(--bad); } }
.cell:hover { filter: brightness(1.08); }
.cell.gapstart { margin-left: 3px; }

.status {
  border-radius: 10px; padding: 10px 12px; font-size: 14px; line-height: 1.4;
  background: var(--stage-2); border: 1px solid var(--line);
}
.status.bad { background: var(--bad-soft); border-color: transparent; color: var(--ink); }
.status.bad b { color: var(--bad); }
.status.ok b { color: var(--ok); }

.row { display: flex; flex-wrap: wrap; gap: 8px; }
.btn {
  border: 1px solid transparent; background: var(--accent-soft); color: var(--accent-text); border-radius: 10px;
  padding: 9px 14px; font-size: 14px; font-weight: 600; cursor: pointer;
  display: inline-flex; align-items: center; gap: 8px;
}
.btn:hover:not(:disabled) { border-color: var(--accent); }
.btn:disabled { opacity: .45; cursor: default; }
.btn.primary {
  background: var(--accent); border-color: var(--accent); color: var(--accent-ink);
  font-family: var(--f-display); font-weight: 500; font-size: 15px; padding: 12px 18px;
}
.btn.primary:hover:not(:disabled) { filter: brightness(1.07); border-color: var(--accent); }
.btn.wide { flex: 1 1 auto; justify-content: center; }
.btn.go {
  font-size: 19px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; padding: 15px 18px;
  box-shadow: 0 6px 18px -8px var(--accent);
}

/* face editor */
.facetabs { display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px; }
.ftab {
  display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 6px 2px 5px;
  border: 1px solid var(--line); background: var(--surface); border-radius: 9px; cursor: pointer; font-size: 11.5px; color: var(--muted);
}
.ftab .fd { width: 18px; height: 18px; border-radius: 5px; box-shadow: inset 0 0 0 1px rgba(0,0,0,.2); position: relative; }
.ftab.full .fd::after { content: "✓"; position: absolute; inset: 0; display: grid; place-items: center; font-size: 11px; font-weight: 800; color: rgba(0,0,0,.55); }
.ftab[aria-selected="true"] { border-color: var(--accent); background: var(--accent-soft); color: var(--accent-text); font-weight: 600; }
.face-editor {
  display: grid; grid-template-columns: auto auto auto; grid-template-rows: auto auto auto;
  justify-content: center; align-items: center; gap: 8px 10px;
}
.up-tag {
  grid-column: 2; display: flex; flex-direction: column; align-items: center; gap: 2px;
  font-size: 13px; color: var(--accent-text); font-weight: 600;
}
.up-tag svg { display: block; }
.up-tag .who { display: inline-flex; align-items: center; gap: 6px; }
.ndot { width: 13px; height: 13px; border-radius: 4px; display: inline-block; box-shadow: inset 0 0 0 1px rgba(0,0,0,.25); }
.side-tag { display: flex; flex-direction: column; align-items: center; gap: 6px; }
.side-tag .ndot { width: 10px; height: 26px; border-radius: 4px; }
.bottom-tag { grid-column: 2; display: flex; justify-content: center; }
.bottom-tag .ndot { width: 26px; height: 10px; }
.rot {
  width: 40px; height: 40px; border-radius: 50%; border: 1px solid transparent; cursor: pointer;
  background: var(--accent-soft); color: var(--accent-text); font-size: 20px; line-height: 1; display: grid; place-items: center;
}
.rot:hover { border-color: var(--accent); }
.face-grid {
  --fc: clamp(50px, 15vw, 64px);
  display: grid; grid-template-columns: repeat(3, var(--fc)); grid-template-rows: repeat(3, var(--fc)); gap: 5px;
  padding: 7px; border-radius: 14px; background: #15161A; border-top: 4px solid var(--accent);
}
.fcell { border: 0; border-radius: 8px; cursor: pointer; box-shadow: inset 0 -4px 0 rgba(0,0,0,.14); padding: 0; }
.fcell.empty { background: transparent !important; box-shadow: inset 0 0 0 2px #5A606C; }
.fcell.bad { animation: badpulse .9s ease-in-out infinite; }
.fcell:hover { filter: brightness(1.08); }
.face-nav { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.face-nav span { font-size: 12.5px; color: var(--muted); font-variant-numeric: tabular-nums; }
.arw { display: block; line-height: 1; font-weight: 800; color: rgba(0,0,0,.55); pointer-events: none; }
.cell .arw { font-size: 13px; }
.fcell .arw { font-size: 26px; }
.lt .arw { color: rgba(255,255,255,.9); }
.toggle {
  display: flex; align-items: flex-start; gap: 10px; cursor: pointer; font-size: 14px;
  padding: 10px 12px; border-radius: 10px; background: var(--accent-soft); color: var(--ink);
}
.toggle input { accent-color: var(--accent); width: 18px; height: 18px; margin: 1px 0 0; flex: none; }
.toggle small { display: block; color: var(--muted); font-size: 12.5px; margin-top: 2px; }
.phase-sep { flex-basis: 100%; font-size: 11.5px; text-transform: uppercase; letter-spacing: .08em; color: var(--accent-text); font-weight: 600; margin-top: 6px; }
.arrows-mode .fcell, .arrows-mode .cell { cursor: alias; }
.arrows-mode .fcell .arw { font-size: 30px; }
.tool-row { display: flex; gap: 8px; align-items: stretch; }
.tool-row .seg { flex: 1 1 auto; }
.undo { white-space: nowrap; }
.tool-hint { margin: 0; font-size: 13.5px; color: var(--muted); max-width: 60ch; transition: color .2s; }
.tool-hint.flash { color: var(--warn); }
.seg.wide { display: grid; grid-template-columns: 1fr 1fr; }
.seg.wide button { padding: 9px 12px; font-size: 14px; font-weight: 600; }
.mv.p2:not(.now):not(.past) { border-color: var(--accent-soft); }

/* solve mode */
.hold {
  display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center; font-size: 14px;
  background: var(--stage-2); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px;
}
.hold .dotc { width: 14px; height: 14px; border-radius: 4px; display: inline-block; vertical-align: -2px; margin-right: 5px; box-shadow: inset 0 0 0 1px rgba(0,0,0,.2); }
.move-card {
  border: 1px solid var(--line); border-radius: var(--r); padding: 16px;
  display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 4px 16px; align-items: center;
}
.move-card .big {
  grid-row: span 2; font-family: var(--f-mono); font-weight: 800; font-size: 48px; line-height: 1;
  color: var(--accent); min-width: 2.2ch; text-align: center;
}
.move-card .what { font-weight: 600; font-size: 16px; }
.move-card .how { color: var(--muted); font-size: 13.5px; }
.move-card.done .big { color: var(--ok); font-size: 36px; }
.progress { display: flex; align-items: center; gap: 10px; font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
.bar { flex: 1; height: 6px; background: var(--stage-2); border: 1px solid var(--line); border-radius: 99px; overflow: hidden; }
.bar i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .25s; }
.moves { display: flex; flex-wrap: wrap; gap: 5px; }
.mv {
  font-family: var(--f-mono); font-weight: 500; font-size: 13px; min-width: 38px; padding: 5px 7px;
  border: 1px solid var(--line); background: var(--surface); border-radius: 7px; cursor: pointer;
  font-variant-numeric: tabular-nums;
}
.mv.past { color: var(--muted); background: var(--stage-2); border-color: transparent; text-decoration: line-through; text-decoration-color: var(--line); }
.mv.now { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 800; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.seg button { border: 0; background: var(--surface); padding: 7px 11px; font-size: 13px; cursor: pointer; }
.seg button + button { border-left: 1px solid var(--line); }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
.legend { font-size: 13px; color: var(--muted); margin: 0; }
.legend code { font-family: var(--f-mono); color: var(--ink); font-weight: 800; }

.overlay {
  position: absolute; inset: 0; display: grid; place-items: center; background: color-mix(in srgb, var(--stage) 60%, transparent);
  font-family: var(--f-display); font-size: 15px;
}

@media (max-width: 820px) {
  html, body { height: auto; }
  main.work { grid-template-columns: minmax(0, 1fr); }
  .stage-hint { display: none; }
  .stage { height: min(80vw, 400px); min-height: 290px; position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; box-shadow: 0 1px 0 var(--line); }
  body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--stage); }
  .panel { border-left: 0; border-top: 1px solid var(--line); overflow: visible; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
}
@media (prefers-reduced-motion: reduce) {
  .swatch .chip, .bar i { transition: none; }
  .cell.bad { animation: none; box-shadow: inset 0 0 0 3px var(--bad); }
}
</style>
</head>
<body>
<header class="top">
  <div class="brand">
    <h1><span class="dot" aria-hidden="true"><i style="background:#11A35A"></i><i style="background:#D21F2B"></i><i style="background:#FFD21F"></i><i style="background:#1453C8"></i></span>Cube Solver</h1>
    <p>разметь кубик 3×3, и он покажет, как его собрать</p>
  </div>
  <div class="solver-chip busy" id="solverChip"><i></i><span id="solverText">Решатель загружается</span></div>
</header>

<main class="work">
  <div class="stage" id="stage">
    <canvas id="gl" aria-label="Трёхмерный кубик Рубика"></canvas>
    <div class="stage-hint" id="stageHint"></div>
    <div class="stage-tools"><button class="ghost" id="viewBtn" type="button">Вид спереди</button></div>
    <div class="overlay" id="overlay" hidden><span id="overlayText">Считаю решение…</span></div>
  </div>

  <aside class="panel" id="panel">
    <!-- EDIT MODE -->
    <div id="editMode" style="display:contents">
      <section>
        <span class="label">Шаг 1. Разметка по граням</span>
        <p class="lead" id="editLead"></p>
      </section>
      <label class="toggle" for="arrowsChk"><input type="checkbox" id="arrowsChk">
        <span>Кубик с картинками
          <small>Разметка стрелок. Соберёт так, чтобы все стрелки смотрели вверх. Для цветов снимите галочку.</small></span></label>
      <section id="toolSec">
        <div class="tool-row">
          <button class="btn undo" id="undoBtn" type="button" title="Отменить последнее действие (Ctrl+Z)" disabled>↶ Отменить</button>
        </div>
        <p class="tool-hint" id="toolHint"></p>
      </section>
      <section id="paletteSec">
        <span class="label">Цвет</span>
        <div class="palette" id="palette" role="group" aria-label="Цвет наклейки"></div>
      </section>
      <section>
        <span class="label">Грань</span>
        <div class="facetabs" id="faceTabs" role="tablist" aria-label="Грани кубика"></div>
        <div class="face-editor">
          <div class="up-tag" id="upTag"></div>
          <div class="side-tag" style="grid-row:2; grid-column:1"><span class="ndot" id="leftDot"></span><button class="rot" id="rotL" type="button" title="Повернуть грань против часовой" aria-label="Повернуть грань против часовой">⟲</button></div>
          <div class="face-grid" id="faceGrid" style="grid-row:2; grid-column:2"></div>
          <div class="side-tag" style="grid-row:2; grid-column:3"><span class="ndot" id="rightDot"></span><button class="rot" id="rotR" type="button" title="Повернуть грань по часовой" aria-label="Повернуть грань по часовой">⟳</button></div>
          <div class="bottom-tag" style="grid-row:3"><span class="ndot" id="bottomDot"></span></div>
        </div>
        <div class="face-nav">
          <button class="btn" id="facePrev" type="button">← Назад</button>
          <span id="faceNum">Грань 1 из 6</span>
          <button class="btn" id="faceNext" type="button">Дальше →</button>
        </div>
      </section>
      <section>
        <span class="label">Развёртка целиком</span>
        <div class="net-wrap"><div class="net" id="net"></div></div>
      </section>
      <div class="status" id="status" role="status"></div>
      <div class="row">
        <button class="btn" id="exampleBtn" type="button">Пример</button>
        <button class="btn" id="solvedBtn" type="button">Собранный</button>
        <button class="btn" id="clearBtn" type="button">Очистить</button>
      </div>
      <button class="btn primary wide go" id="solveBtn" type="button">Собрать</button>
    </div>

    <!-- SOLVE MODE -->
    <div id="solveMode" style="display:flex; flex-direction:column; gap:18px" hidden>
      <section>
        <span class="label">Шаг 2. Сборка</span>
        <div class="hold" id="hold"></div>
      </section>
      <div class="move-card" id="moveCard">
        <div class="big" id="mvBig">R</div>
        <div class="what" id="mvWhat"></div>
        <div class="how" id="mvHow"></div>
      </div>
      <div class="progress"><span id="progText">0 / 0</span><div class="bar"><i id="progBar"></i></div></div>
      <div class="row">
        <button class="btn" id="prevBtn" type="button" aria-label="Шаг назад">← Назад</button>
        <button class="btn primary wide" id="nextBtn" type="button">Сделать ход</button>
        <button class="btn" id="playBtn" type="button">▶ Авто</button>
      </div>
      <div class="row" style="align-items:center; justify-content:space-between">
        <span class="label">Скорость</span>
        <div class="seg" id="speedSeg">
          <button type="button" data-s="slow">Медленно</button>
          <button type="button" data-s="normal" aria-pressed="true">Обычно</button>
          <button type="button" data-s="fast">Быстро</button>
        </div>
      </div>
      <section>
        <span class="label">Все ходы</span>
        <div class="moves" id="moves"></div>

const CUBEJS = ['https://cdn.jsdelivr.net/npm/cubejs@1.3.2/lib/cube.js', 'https://cdn.jsdelivr.net/npm/cubejs@1.3.2/lib/solve.js'];

  const c = $('solverChip'); c.className = 'solver-chip ' + kind; $('solverText').textContent = text;

function startWorker() {
  try {
    const src = 'importScripts(' + CUBEJS.map(u => JSON.stringify(u)).join(',') + ');' +
      'var ready=false;self.onmessage=function(e){var d=e.data;try{if(!ready){Cube.initSolver();ready=true;}' +
      'if(d.type==="init"){postMessage({type:"ready"});}else if(d.type==="solve"){postMessage({type:"solution",s:d.list.map(function(l){return Cube.fromString(l).solve();})});}}' +
      'catch(err){postMessage({type:"error",msg:String(err&&err.message||err)});}};';
    worker = new Worker(URL.createObjectURL(new Blob([src], { type: 'text/javascript' })));
    worker.onmessage = e => {
      const d = e.data;
      if (d.type === 'ready') { workerReady = true; setChip('ready', 'Решатель готов'); }
      else if (pendingSolve) {
        const p = pendingSolve; pendingSolve = null;
        d.type === 'solution' ? p.resolve(d.s) : p.reject(new Error(d.msg));
      }
    };
    worker.onerror = e => {
      if (e && e.preventDefault) e.preventDefault();
      try { worker.terminate(); } catch (x) {}
      worker = null; workerReady = false;
      setChip('', 'Решатель запустится по кнопке');
      if (pendingSolve) { const p = pendingSolve; pendingSolve = null; mainSolve(p.list).then(p.resolve, p.reject); }
    };

  } catch (e) {
    worker = null; setChip('', 'Решатель запустится по кнопке');
  }
}

  if (!window.Cube || !window.Cube.initSolver) { await loadScript(CUBEJS[0]); await loadScript(CUBEJS[1]); }
  if (!mainInit) { $('overlayText').textContent = 'Готовлю решатель, пара секунд…'; await frame(); window.Cube.initSolver(); mainInit = true; setChip('ready', 'Решатель готов'); }

  for (let f = 0; f < 54; f++) {
    const c = state[f];
    stickers[f].material.color.set(c < 0 ? EMPTY3D : COLORS[c].hex);
    const am = arwMeshes[f], a = shownArrow(f);
    am.visible = arrowsOn && c >= 0 && a >= 0;
    if (am.visible) {
      const n = new V3(...GEOM[f].n), d = new V3(...arrowDir(f, a)), r = new V3().crossVectors(d, n);
      am.quaternion.setFromRotationMatrix(_m4.makeBasis(r, d, n));

// arrows
function cssVar(name) { return getComputedStyle(document.documentElement).getPropertyValue(name).trim() || '#C8106F'; }
const arrowMat = new THREE.MeshBasicMaterial({ color: cssVar('--accent'), transparent: true, opacity: 0.96 });

let editMarker = null;
function buildEditMarker() {
  if (editMarker) { cubeRoot.remove(editMarker); editMarker.traverse(o => { if (o.geometry) o.geometry.dispose(); }); editMarker = null; }
  if (mode !== 'edit') return;
  const { n, up, right } = faceBasis(curFace);
  const g = new THREE.Group();
  g.quaternion.setFromRotationMatrix(new THREE.Matrix4().makeBasis(right, up, n));
  const z = 1.52, L = 3.14, t = 0.06;
  [[0, L / 2, L + t, t], [0, -L / 2, L + t, t], [L / 2, 0, t, L + t], [-L / 2, 0, t, L + t]].forEach(([x, y, w, h]) => {
    const b = new THREE.Mesh(new THREE.BoxGeometry(w, h, 0.03), markMat); b.position.set(x, y, z); g.add(b);
  });

function arc(c, u, v, R, a0, sweep, tube, headR, headL, mat) {

  cap.quaternion.setFromUnitVectors(new V3(0, 1, 0), back);

let arrowGroup = null;
function setArrow(move) {

  if (!move) return;
  const { face, turns } = parseMove(move);
  const n = new V3(...NORMALS[face]);
  const u = Math.abs(n.y) > 0.5 ? new V3(1, 0, 0) : new V3(0, 1, 0);
  const v = new V3().crossVectors(n, u);

  g.add(arc(n.clone().multiplyScalar(1.57), u, v, 0.9, Math.PI * 0.75, dir * Math.PI * 1.45, 0.058, 0.155, 0.36, arrowMat));

// sizing
function resize() {

  camera.aspect = w / h;
  const half = 2.55, t = Math.tan(THREE.MathUtils.degToRad(camera.fov / 2));

new ResizeObserver(resize).observe(stage);

// interaction
const ray = new THREE.Raycaster(), ndc = new THREE.Vector2();
let drag = null, viewTarget = null;
function pick(ev) {
  const r = canvas.getBoundingClientRect();
  ndc.set(((ev.clientX - r.left) / r.width) * 2 - 1, -((ev.clientY - r.top) / r.height) * 2 + 1);
  ray.setFromCamera(ndc, camera);
  const hit = ray.intersectObjects(cubies, true)[0];
  if (!hit) return -1;
  // map the hit point to the sticker cell under it, so the gaps, the plastic edge and the printed arrow all count
  const p = cubeRoot.worldToLocal(hit.point.clone()), a = [p.x, p.y, p.z];
  const ax = [0, 1, 2].reduce((m, i) => (Math.abs(a[i]) > Math.abs(a[m]) ? i : m), 0);
  if (Math.abs(a[ax]) < 1.3) return -1;
  const n = [0, 0, 0]; n[ax] = Math.sign(a[ax]);
  const pos = a.map((v, i) => (i === ax ? n[ax] : Math.max(-1, Math.min(1, Math.round(v)))));
  const f = GEOM_INDEX[key(pos, n)];

}
canvas.addEventListener('pointerdown', ev => {
  drag = { id: ev.pointerId, x: ev.clientX, y: ev.clientY, sx: ev.clientX, sy: ev.clientY, moved: false };
  canvas.setPointerCapture(ev.pointerId); viewTarget = null;
});
canvas.addEventListener('pointermove', ev => {
  if (!drag || ev.pointerId !== drag.id) {
    if (mode === 'edit' && ev.pointerType === 'mouse') canvas.classList.toggle('paintable', pick(ev) >= 0);
    return;
  }
  const dx = ev.clientX - drag.x, dy = ev.clientY - drag.y;
  if (!drag.moved && Math.hypot(ev.clientX - drag.sx, ev.clientY - drag.sy) > (ev.pointerType === 'mouse' ? 6 : 14)) { drag.moved = true; canvas.classList.add('dragging'); }
  if (drag.moved) {
    cubeRoot.quaternion.premultiply(new THREE.Quaternion().setFromAxisAngle(new V3(0, 1, 0), dx * 0.009));
    cubeRoot.quaternion.premultiply(new THREE.Quaternion().setFromAxisAngle(new V3(1, 0, 0), dy * 0.009));
  }

});
function endDrag(ev) {

}
canvas.addEventListener('pointerup', endDrag);
canvas.addEventListener('pointercancel', endDrag);
$('viewBtn').addEventListener('click', () => { viewTarget = mode === 'edit' ? faceQuat(curFace) : qDefault.clone(); });

// animation
let anim = null, spin = null;
const ease = t => t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
function turn(move, dur) {
  return new Promise(resolve => {
    const { face, turns } = parseMove(move);
    const n = new V3(...NORMALS[face]);
    const pivot = new THREE.Group(); cubeRoot.add(pivot);
    const list = cubies.filter(c => c.userData.home.dot(n) > 0.5);
    list.forEach(c => pivot.add(c));
    const angle = turns === 2 ? -Math.PI : turns === 1 ? -Math.PI / 2 : Math.PI / 2;
    anim = { pivot, n, angle, list, t0: performance.now(), dur: REDUCED ? Math.min(dur, 200) * (turns === 2 ? 1.3 : 1) : dur * (turns === 2 ? 1.45 : 1), resolve, move };
  });
}
function tick(now) {
  if (anim) {
    const t = Math.min(1, (now - anim.t0) / anim.dur);
    anim.pivot.quaternion.setFromAxisAngle(anim.n, anim.angle * ease(t));
    if (t >= 1) {
      const a = anim; anim = null;
      a.list.forEach(c => { cubeRoot.add(c); c.position.copy(c.userData.home); c.quaternion.identity(); });
      cubeRoot.remove(a.pivot);
      applyFull(a.move); recolor();

  }

    else if (m.emissive.r) m.emissive.setRGB(0, 0, 0);

}

// ===== Solve mode =====
function setMode(m) {
  mode = m;
  $('editMode').hidden = m !== 'edit';
  $('solveMode').hidden = m !== 'solve';
  $('stageHint').textContent = m === 'edit'
    ? (arrowsOn ? 'Тяните — вращать, нажатие — повернуть стрелку.' : 'Тяните — вращать, нажатие — закрасить.')
    : 'Повторяйте ходы, держа кубик как на экране.';
  canvas.classList.remove('paintable');
  if (stickers.length) recolor();
  $('viewBtn').textContent = m === 'edit' ? 'К грани' : 'Вид спереди';
  if (m === 'edit') { buildEditMarker(); viewTarget = faceQuat(curFace); } else buildEditMarker();
}
const toLetters = s => { const c = {}; for (let i = 0; i < 6; i++) c[s[i * 9 + 4]] = FACES[i]; return s.map(x => c[x]).join(''); };
const ALL_MOVES = FACES.flatMap(f => [f, f + '2', f + "'"]);
async function startSolve() {
  const v = validate(state);
  if (!v.ok || fullySolved() || (arrowsOn && cornerParity(state) !== cent.reduce((a, b) => a + b, 0) % 2)) { refreshStatus(); return; }
  $('overlayText').textContent = workerReady || mainInit ? 'Считаю решение…' : 'Готовлю решатель, пара секунд…';
  $('overlay').hidden = false; $('solveBtn').disabled = true;
  try {
    // with arrows: try several starting moves and keep the shortest total (pieces + center fix)
    const prefixes = arrowsOn ? [[]].concat(ALL_MOVES.map(m => [m])) : [[]];
    const list = prefixes.map(P => toLetters(P.reduce((s, m) => applyMove(s, m), state)));
    const sols = await solveMany(list);
    let best = null;
    sols.forEach((s, i) => {
      const S = simplify(prefixes[i].concat(String(s).trim().split(/\s+/).filter(Boolean)));
      let F = [];
      if (arrowsOn) { const c = moveCounts(S).map((x, k) => (x + cent[k]) % 4); F = centerFix(c) || []; }
      if (!best || S.length + F.length < best.S.length + best.F.length) best = { S, F };
    });

  const mv = $('moves'); mv.innerHTML = '';
  chips = [];
  moves.forEach((m, i) => {
    if (i === phase2 && phase2 < moves.length) {
      const d = document.createElement('div'); d.className = 'phase-sep';
      d.textContent = phase2 ? 'Доворот центров' : 'Доворот центров: цвета уже на месте';
      mv.appendChild(d);
    }
    const b = document.createElement('button'); b.type = 'button'; b.className = 'mv'; b.textContent = m;
    b.title = `Перейти к ходу ${i + 1}`;
    b.addEventListener('click', () => jump(i));
    mv.appendChild(b); chips.push(b);
  });
  setMode('solve'); viewTarget = qDefault.clone();
  updateSolveUI();
  $('nextBtn').focus({ preventScroll: true });
}
function updateSolveUI() {
  const n = moves.length, done = idx >= n;
  const card = $('moveCard');
  card.classList.toggle('done', done);
  if (done) {
    $('mvBig').textContent = '✓';
    $('mvWhat').textContent = 'Кубик собран!';
    $('mvHow').textContent = `${n} ${plural(n, ['ход', 'хода', 'ходов'])}.`;
    $('progText').textContent = `Готово: ${n} / ${n}`;
  } else {
    const m = moves[idx], { face, turns } = parseMove(m);
    $('mvBig').textContent = m;
    $('mvWhat').textContent = `${FACE_RU[face]} грань ` + (turns === 2 ? 'на пол-оборота' : turns === 1 ? 'по часовой стрелке' : 'против часовой стрелки');
    $('mvHow').textContent = (turns === 2 ? 'Направление любое.' : 'Спереди: ' + (turns === 1 ? HINT_CW : HINT_CCW)[face] + '.') +

    $('progText').textContent = `Ход ${idx + 1} из ${n}`;
  }

  chips.forEach((b, i) => { b.className = 'mv' + (i >= phase2 ? ' p2' : '') + (i < idx ? ' past' : i === idx ? ' now' : ''); });
  $('prevBtn').disabled = busy || idx === 0;
  $('nextBtn').disabled = busy || done;
  $('playBtn').disabled = done && !playing;
  $('playBtn').textContent = playing ? '❚❚ Пауза' : '▶ Авто';
  setArrow(done ? null : moves[idx]);
}
async function doNext() {
  if (busy || idx >= moves.length) return;
  busy = true; updateButtonsBusy();
  await turn(moves[idx], SPEEDS[speed].turn);
  idx++; busy = false; updateSolveUI();
  if (idx >= moves.length) { playing = false; updateSolveUI(); if (!REDUCED) spin = { t0: performance.now(), last: 0 }; }
}
async function doPrev() {
  if (busy || idx === 0) return;
  busy = true; updateButtonsBusy(); setArrow(null);
  await turn(inverseMove(moves[idx - 1]), SPEEDS[speed].turn);
  idx--; busy = false; updateSolveUI();
}
function updateButtonsBusy() { $('prevBtn').disabled = true; $('nextBtn').disabled = true; }

}

$('solveBtn').addEventListener('click', startSolve);
$('exampleBtn').addEventListener('click', () => {

  for (let i = 0; i < 22; i++) { let m; do { m = ms[Math.floor(Math.random() * 18)]; } while (m[0] === last); last = m[0]; applyFull(m); }
  save(); refresh();
});
$('solvedBtn').addEventListener('click', () => { pushUndo(); marks.fill(-1); state = solvedState(); cent = [0, 0, 0, 0, 0, 0]; save(); refresh(); });
$('arrowsChk').checked = arrowsOn;
$('arrowsChk').addEventListener('change', e => { arrowsOn = e.target.checked; save(); setTool(); refresh(); $('stageHint').textContent = arrowsOn ? 'Тяните — вращать, нажатие — повернуть стрелку.' : 'Тяните — вращать, нажатие — закрасить.'; });
$('undoBtn').addEventListener('click', undo);
$('clearBtn').addEventListener('click', () => {
  pushUndo(); marks.fill(-1);
  state = state.map((c, i) => (i % 9 === 4 ? (c >= 0 ? c : FACE_COLOR[Math.floor(i / 9)]) : -1)); cent = [0, 0, 0, 0, 0, 0]; save(); refresh();
});

});
$('speedSeg').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  speed = b.dataset.s;
  [...$('speedSeg').children].forEach(x => x.setAttribute('aria-pressed', String(x === b)));
});
document.addEventListener('keydown', e => {
  if ((e.metaKey || e.ctrlKey) && !e.shiftKey && (e.key === 'z' || e.key === 'я' || e.code === 'KeyZ') && mode === 'edit') { e.preventDefault(); undo(); return; }
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  if (mode === 'edit' && /^[1-6]$/.test(e.key)) { if (tool === 'color') selectColor(+e.key - 1); return; }
  if (mode === 'edit' && (e.key === 'ArrowRight' || e.key === 'ArrowLeft')) { e.preventDefault(); stepFace(e.key === 'ArrowRight' ? 1 : -1); return; }
  if (mode === 'solve') {
    if (e.key === 'ArrowRight') { e.preventDefault(); playing = false; doNext(); }
    else if (e.key === 'ArrowLeft') { e.preventDefault(); playing = false; doPrev(); }
    else if (e.key === ' ' && !(e.target instanceof HTMLButtonElement)) { e.preventDefault(); play(); }
  }
});
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', syncAccent);
new MutationObserver(syncAccent).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });

buildPalette(); buildNet(); buildFaceUI(); setTool(); refresh(); resize(); setMode('edit');
requestAnimationFrame(tick);
startWorker();
